name: Report bot index status
description: >-
  Open, update or close the tracking issue that records whether the answer bot
  can restore its search indexes.

# This owns the tracking issue title, which updateEvalTrackingIssue.cjs uses as
# the lookup key. Every reporter must spell it identically or one alarm silently
# becomes two issues that can flap each other open and closed, so the string
# lives here once instead of in each calling workflow.
#
# The health predicate lives here too, for the same reason: the bot workflow and
# the scheduled self-check must agree on what "degraded" means even though they
# differ on what is worth failing a run over.

inputs:
  docs:
    description: '"true" when the docs index was restored'
    required: true
  posts:
    description: '"true" when the posts index was restored'
    required: true
  docs-stale:
    description: '"true" when the docs pipeline looks dead'
    required: false
    default: 'false'
  posts-stale:
    description: '"true" when the posts pipeline looks dead'
    required: false
    default: 'false'
  docs-status:
    description: '"fresh", "stale" or "unknown" for the docs index'
    required: false
    default: ''
  posts-status:
    description: '"fresh", "stale" or "unknown" for the posts index'
    required: false
    default: ''
  docs-age-days:
    description: 'Age of the newest docs artifact in whole days, or "" if unknown'
    required: false
    default: ''
  posts-age-days:
    description: 'Age of the newest posts artifact in whole days, or "" if unknown'
    required: false
    default: ''
  docs-source:
    description: 'Where the docs index was restored from - "cache", "artifact" or "none"'
    required: false
    default: ''
  posts-source:
    description: 'Where the posts index was restored from - "cache", "artifact" or "none"'
    required: false
    default: ''
  quiet:
    description: >-
      When "true", an already-open issue has its body refreshed but collects no
      new comment. Set it on reporters that fire once per user post.
    required: false
    default: 'true'
  github-token:
    description: Token with issues write scope, used to maintain the tracking issue
    required: false
    default: ${{ github.token }}

outputs:
  healthy:
    description: '"true" when both indexes are present and freshly published'
    value: ${{ steps.assess.outputs.healthy }}

runs:
  using: composite

  steps:
    - name: Assess
      id: assess
      shell: bash
      env:
        DOCS: ${{ inputs.docs }}
        POSTS: ${{ inputs.posts }}
        DOCS_STALE: ${{ inputs.docs-stale }}
        POSTS_STALE: ${{ inputs.posts-stale }}
        DOCS_STATUS: ${{ inputs.docs-status }}
        POSTS_STATUS: ${{ inputs.posts-status }}
        DOCS_AGE: ${{ inputs.docs-age-days }}
        POSTS_AGE: ${{ inputs.posts-age-days }}
        DOCS_SOURCE: ${{ inputs.docs-source }}
        POSTS_SOURCE: ${{ inputs.posts-source }}
      run: |
        set -euo pipefail

        # Word the problem line for one index, distinguishing a confirmed
        # outage from a state the API could not be queried for
        index_problem() {
          local label="$1" found="$2" stale="$3" status="$4" age="$5"
          if [ "$found" != "true" ]; then
            printf -- '- The %s index could not be restored, from cache or from artifacts.\n' "$label"
            return
          fi
          [ "$stale" = "true" ] || return
          if [ "$status" = "unknown" ]; then
            printf -- '- The %s index'"'"'s publication state is unknown - the artifact API could not be queried.\n' "$label"
          elif [ -n "$age" ]; then
            printf -- '- The %s index is being served from a pipeline that last published %s day(s) ago.\n' "$label" "$age"
          else
            printf -- '- The %s index is being served from a pipeline that has not published recently.\n' "$label"
          fi
        }

        problems=""
        problems="${problems}$(index_problem docs "$DOCS" "$DOCS_STALE" "$DOCS_STATUS" "$DOCS_AGE")"
        problems="${problems}$(index_problem posts "$POSTS" "$POSTS_STALE" "$POSTS_STATUS" "$POSTS_AGE")"

        if [ -z "$problems" ]; then
          echo "healthy=true" >> "$GITHUB_OUTPUT"
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi
        {
          echo 'body<<TRACKING_EOF'
          printf 'The answer bot'"'"'s search index is degraded:\n\n'
          printf '%s\n' "$problems"
          printf '\nCheck that `docs-embeddings.yml` and `posts-embeddings.yml` are still succeeding and still uploading their `docs-index` / `posts-index` artifacts.\n'
          echo 'TRACKING_EOF'
        } >> "$GITHUB_OUTPUT"

        # A run-level summary a maintainer sees without expanding step logs
        restored() { [ "$1" = "true" ] && echo "yes" || echo "no"; }
        age_cell() { [ -n "$1" ] && echo "$1 day(s)" || echo "unknown"; }
        {
          echo '### Answer bot index status'
          echo ''
          echo '| Index | Restored | Source | Age |'
          echo '| --- | --- | --- | --- |'
          echo "| docs | $(restored "$DOCS") | ${DOCS_SOURCE:-unknown} | $(age_cell "$DOCS_AGE") |"
          echo "| posts | $(restored "$POSTS") | ${POSTS_SOURCE:-unknown} | $(age_cell "$POSTS_AGE") |"
        } >> "$GITHUB_STEP_SUMMARY"

    # Reporting a problem must never be what breaks the run
    - name: Update the tracking issue
      id: track
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        TRACKING_ISSUE_TITLE: '🚨 Answer bot search index is degraded'
        EVAL_NAME: answer bot index restore
        EVAL_OUTCOME: ${{ steps.assess.outputs.outcome }}
        TRACKING_ISSUE_BODY: ${{ steps.assess.outputs.body }}
        TRACKING_ISSUE_QUIET: ${{ inputs.quiet }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/index.cjs`);
          await bot.updateEvalTrackingIssue({github, context});

    # A failed alarm is itself worth an alarm - the ::warning:: buried in the
    # tracking step is easy to miss when the job still finishes green
    - name: Flag a failed tracking-issue update
      if: steps.track.outcome == 'failure'
      shell: bash
      run: echo "::error::Failed to update the index tracking issue"
