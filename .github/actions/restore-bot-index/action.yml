name: Restore bot index
description: >-
  Restore the docs or posts embeddings index from the Actions cache, falling
  back to the artifact uploaded by the workflow that builds it.

# The Actions cache is capped per repository and evicted least-recently-used, so
# a 1-2 MB index regularly disappears within hours of being written. Artifacts
# are not evicted, so they are what makes the restore dependable.
#
# Each index lives in a fixed directory (.docs-index / .posts-index) holding a
# single index.json, and is published under a fixed artifact name, so the caller
# only has to say which one it wants.

inputs:
  index:
    description: Which index to restore - "docs" or "posts"
    required: true
  github-token:
    description: Token with actions read scope, used to find and download the artifact
    required: true
  max-age-days:
    description: >-
      Report the index as stale once the newest artifact is at least this many
      days old. Both producers run on a daily cron (docs-embeddings 03:30,
      posts-embeddings 04:30), so the default tolerates two missed nights -
      raise it here if either cron is ever moved to a slower cadence.
    required: false
    default: '3'

outputs:
  found:
    description: '"true" when the index is available afterwards'
    value: ${{ steps.report.outputs.found }}
  stale:
    description: >-
      '"true" when the index is usable but the pipeline that publishes it looks
      dead - no unexpired artifact at all, or the newest one is older than
      max-age-days. Callers that are health checks should treat this as a
      failure; callers serving a user should keep going.'
    value: ${{ steps.report.outputs.stale }}
  age-days:
    description: 'Age of the newest artifact in whole days, or "" if unknown'
    value: ${{ steps.report.outputs.age-days }}

runs:
  using: composite

  steps:
    - name: Resolve the index
      id: cfg
      shell: bash
      env:
        INDEX: ${{ inputs.index }}
      run: |
        set -euo pipefail
        case "$INDEX" in
          docs|posts) ;;
          *) echo "::error::Unknown index '$INDEX' - expected 'docs' or 'posts'"; exit 1 ;;
        esac
        echo "path=.$INDEX-index" >> "$GITHUB_OUTPUT"
        echo "artifact=$INDEX-index" >> "$GITHUB_OUTPUT"

    - name: Restore the docs index from cache
      if: inputs.index == 'docs'
      uses: actions/cache/restore@v6
      with:
        path: .docs-index
        key: >-
          docs-embeddings-v3-${{ hashFiles(
            'docs/**/*.md',
            '.github/bot-scripts/buildDocsIndex.cjs',
            '.github/bot-scripts/docsIndex.cjs',
            '.github/bot-scripts/localEmbeddings.cjs',
            '.github/bot-scripts/package-lock.json'
          ) }}
        restore-keys: docs-embeddings-v3-

    - name: Restore the posts index from cache
      if: inputs.index == 'posts'
      uses: actions/cache/restore@v6
      with:
        path: .posts-index
        # There is no exact key to match, the newest index is picked
        # via the prefix
        key: posts-embeddings-v2-
        restore-keys: posts-embeddings-v2-

    # Decide on the file, not on the cache key: a prefix match can restore an
    # entry that was saved while its build was still writing it
    - name: Check what the cache gave us
      id: cached
      uses: actions/github-script@v9
      env:
        INDEX_FILE: ${{ steps.cfg.outputs.path }}/index.json
      with:
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/restoreBotIndex.cjs`);
          bot.checkCachedIndex({ core });

    # Runs even on a cache hit: its upload time is also the only honest "is the
    # nightly still running" signal, and selecting on the artifact rather than a
    # run's conclusion keeps an unrelated evaluate/feedback failure from hiding a
    # perfectly good artifact.
    - name: Find the newest usable index artifact
      id: artifact
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ARTIFACT: ${{ steps.cfg.outputs.artifact }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/restoreBotIndex.cjs`);
          await bot.findIndexArtifact({ github, context, core });

    # A partial cache restore must not be mixed with the artifact contents
    - name: Clear the target directory
      if: steps.cached.outputs.ok != 'true' && steps.artifact.outputs.id != ''
      shell: bash
      env:
        DIR: ${{ steps.cfg.outputs.path }}
      run: rm -rf "$DIR"

    - name: Download the index artifact
      id: download
      if: steps.cached.outputs.ok != 'true' && steps.artifact.outputs.id != ''
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.cfg.outputs.artifact }}
        path: ${{ steps.cfg.outputs.path }}
        run-id: ${{ steps.artifact.outputs.id }}
        github-token: ${{ inputs.github-token }}

    - name: Report what was restored
      id: report
      uses: actions/github-script@v9
      env:
        INDEX_FILE: ${{ steps.cfg.outputs.path }}/index.json
        ARTIFACT: ${{ steps.cfg.outputs.artifact }}
        FROM_CACHE: ${{ steps.cached.outputs.ok }}
        ARTIFACT_RUN: ${{ steps.artifact.outputs.id }}
        ARTIFACT_CREATED: ${{ steps.artifact.outputs.created }}
        SEARCHED: ${{ steps.artifact.outputs.searched }}
        LOOKUP: ${{ steps.artifact.outcome }}
        DOWNLOAD: ${{ steps.download.outcome }}
        MAX_AGE_DAYS: ${{ inputs.max-age-days }}
      with:
        script: |
          const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/bot-scripts/restoreBotIndex.cjs`);
          bot.reportRestore({ core });
